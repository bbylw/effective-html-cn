name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 从 Pages 配置取真实站点地址：账号可能使用自定义域名，
      # 不能把 <user>.github.io 写死，否则 canonical / sitemap 会指错地方。
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Pages API 可能返回 http:// 的 origin，canonical / sitemap 一律用 https。
          ORIGIN="${PAGES_ORIGIN#http://}"
          ORIGIN="${ORIGIN#https://}"
          export SITE_URL="https://${ORIGIN%/}${PAGES_PATH}/"
          export SITE_BASE="${PAGES_PATH:-/}"
          echo "SITE_URL=$SITE_URL  SITE_BASE=$SITE_BASE"
          bun run build

      # 禁用 Jekyll，否则以下划线开头的 _astro/ 目录会被 GitHub Pages 忽略。
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
